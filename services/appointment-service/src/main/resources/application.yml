server:
  port: 8080
spring:
  application:
    name: appointment-service
  datasource:
    url: "${MYSQL_URL:jdbc:h2:mem:appointment_service;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}"
    username: "${MYSQL_USERNAME:sa}"
    password: "${MYSQL_PASSWORD:}"
    driver-class-name: "${MYSQL_DRIVER:org.h2.Driver}"
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
pet-service:
  base-url: "${PET_SERVICE_URL:http://localhost:8082}"
  connect-timeout: "${PET_SERVICE_CONNECT_TIMEOUT:2s}"
  read-timeout: "${PET_SERVICE_READ_TIMEOUT:3s}"
management:
  endpoints:
    web:
      exposure:
        include: health,info
