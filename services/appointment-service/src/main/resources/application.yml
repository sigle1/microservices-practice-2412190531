server:
  port: 8080
spring:
  application:
    name: appointment-service
  cloud:
    nacos:
      discovery:
        server-addr: "${NACOS_SERVER_ADDR:localhost:8848}"
        username: "${NACOS_USERNAME:nacos}"
        password: "${NACOS_PASSWORD:}"
        namespace: "${NACOS_NAMESPACE:}"
        group: "${NACOS_GROUP:PERSONAL_GROUP}"
  datasource:
    url: "${MYSQL_URL:jdbc:h2:mem:appointment_service;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}"
    username: "${MYSQL_USERNAME:sa}"
    password: "${MYSQL_PASSWORD:}"
    driver-class-name: "${MYSQL_DRIVER:org.h2.Driver}"
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
pet-service:
  service-name: "pet-service"
  connect-timeout: "${PET_SERVICE_CONNECT_TIMEOUT:2s}"
  read-timeout: "${PET_SERVICE_READ_TIMEOUT:3s}"
management:
  endpoints:
    web:
      exposure:
        include: health,info
