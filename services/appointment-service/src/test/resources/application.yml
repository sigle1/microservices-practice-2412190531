spring:
  cloud:
    nacos:
      discovery:
        enabled: false
  datasource:
    url: jdbc:h2:mem:appointment_service_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
pet-service:
  service-name: pet-service
  connect-timeout: 1s
  read-timeout: 1s
