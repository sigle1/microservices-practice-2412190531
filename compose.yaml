name: petcare-microservices

services:
  nacos:
    image: nacos/nacos-server:v3.2.4
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?set NACOS_AUTH_TOKEN in .env}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?set NACOS_AUTH_IDENTITY_KEY in .env}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?set NACOS_AUTH_IDENTITY_VALUE in .env}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?set NACOS_PASSWORD in .env}
    ports:
      - "127.0.0.1:${NACOS_CONSOLE_PORT:-18080}:8080"
      - "127.0.0.1:${NACOS_HTTP_PORT:-8848}:8848"
      - "127.0.0.1:${NACOS_GRPC_PORT:-9848}:9848"
    volumes:
      - nacos_data:/home/nacos/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS --data-urlencode 'username=nacos'
          --data-urlencode "password=$${NACOS_PASSWORD}"
          http://localhost:8848/nacos/v3/auth/user/login | grep -q accessToken
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks:
      - petcare

  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?set USER_DB_PASSWORD in .env}
      PET_DB_PASSWORD: ${PET_DB_PASSWORD:?set PET_DB_PASSWORD in .env}
      APPOINTMENT_DB_PASSWORD: ${APPOINTMENT_DB_PASSWORD:?set APPOINTMENT_DB_PASSWORD in .env}
    volumes:
      - microservices_mysql_data:/var/lib/mysql
      - ./scripts/init-microservices.sh:/docker-entrypoint-initdb.d/init-microservices.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - petcare

  user-service:
    build: ./services/user-service
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/user_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      MYSQL_USERNAME: user_app
      MYSQL_PASSWORD: ${USER_DB_PASSWORD:?set USER_DB_PASSWORD in .env}
      MYSQL_DRIVER: com.mysql.cj.jdbc.Driver
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?set NACOS_PASSWORD in .env}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      NACOS_GROUP: ${NACOS_GROUP:-PERSONAL_GROUP}
    ports:
      - "${USER_PORT:-8081}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - petcare

  pet-service:
    build: ./services/pet-service
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/pet_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      MYSQL_USERNAME: pet_app
      MYSQL_PASSWORD: ${PET_DB_PASSWORD:?set PET_DB_PASSWORD in .env}
      MYSQL_DRIVER: com.mysql.cj.jdbc.Driver
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?set NACOS_PASSWORD in .env}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      NACOS_GROUP: ${NACOS_GROUP:-PERSONAL_GROUP}
    ports:
      - "${PET_PORT:-8082}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - petcare

  appointment-service:
    build: ./services/appointment-service
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/appointment_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      MYSQL_USERNAME: appointment_app
      MYSQL_PASSWORD: ${APPOINTMENT_DB_PASSWORD:?set APPOINTMENT_DB_PASSWORD in .env}
      MYSQL_DRIVER: com.mysql.cj.jdbc.Driver
      PET_SERVICE_CONNECT_TIMEOUT: 2s
      PET_SERVICE_READ_TIMEOUT: 3s
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?set NACOS_PASSWORD in .env}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      NACOS_GROUP: ${NACOS_GROUP:-PERSONAL_GROUP}
    ports:
      - "${APPOINTMENT_PORT:-8083}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      pet-service:
        condition: service_started
    networks:
      - petcare

volumes:
  microservices_mysql_data:
  nacos_data:

networks:
  petcare:
    driver: bridge
