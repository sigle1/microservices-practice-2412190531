spring:
  datasource:
    url: "${MYSQL_URL:jdbc:mysql://localhost:3306/pet_care?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}"
    username: "${MYSQL_USERNAME:root}"
    password: "${MYSQL_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
